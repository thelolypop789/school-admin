<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/favicon.png" type="image/png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ระบบจัดการงานบริหารทั่วไป วพ." />
    <script>
      // แอปนักเรียน นศท. (/s): ติดตั้งลงหน้าจอแยกจากแอปบุคลากร — ไอคอน ชื่อ และ manifest ของตัวเอง
      if (/^\/s(\/|$)/.test(location.pathname)) {
        document.querySelector('link[rel="manifest"]').href = "/manifest-nst.webmanifest";
        document.querySelector('link[rel="apple-touch-icon"]').href = "/nst-apple-touch-icon.png";
        document.querySelector('meta[name="apple-mobile-web-app-title"]').content = "นศท. วพ.";
        document.title = "นศท. · โรงเรียนวังหลวงพิทยาสรรพ์";
      }
    </script>
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f3f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141218" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="ระบบจัดการงานบริหารทั่วไป โรงเรียนวังหลวงพิทยาสรรพ์: จองห้องประชุม ขอใช้รถไปราชการ และตรวจห้องน้ำตามหลัก HAS" />
    <title>ระบบจัดการงานบริหารทั่วไป · โรงเรียนวังหลวงพิทยาสรรพ์</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&family=IBM+Plex+Sans+Thai+Looped:wght@600&family=Sarabun:wght@400;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
